<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raffle Draw - TV Display</title>
    <style>
        /* TV Display Styles */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --warning-color: #f39c12;
        }
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--primary-color), #1a2530);
            color: white;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .tv-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            position: relative;
        }
        
        .logo {
            margin-bottom: 30px;
        }
        
        .logo h1 {
            font-size: 4rem;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        .draw-title {
            font-size: 3rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        
        .prize-amount {
            font-size: 2.5rem;
            color: var(--warning-color);
            margin-bottom: 30px;
            font-weight: bold;
        }
        
        .participant-count {
            font-size: 1.5rem;
            margin-bottom: 40px;
            opacity: 0.8;
        }
        
        .draw-container {
            background-color: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 40px;
            margin-bottom: 40px;
            backdrop-filter: blur(10px);
            min-width: 600px;
            min-height: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .number-display {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 4px;
            margin: 20px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            font-family: 'Courier New', monospace;
            width: 100%;
        }
        
        .winner-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--warning-color);
            margin: 20px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.3);
            border-radius: 10px;
            padding: 20px;
            width: 100%;
        }
        
        .winners-list {
            margin-top: 20px;
            width: 100%;
        }
        
        .winner-item {
            font-size: 2rem;
            margin: 10px 0;
            padding: 15px;
            background-color: rgba(255,255,255,0.1);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .winner-position {
            background-color: var(--warning-color);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 1.5rem;
        }
        
        .draw-controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .tv-btn {
            padding: 20px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            min-width: 200px;
        }
        
        .tv-btn-start {
            background-color: var(--success-color);
            color: white;
        }
        
        .tv-btn-stop {
            background-color: var(--secondary-color);
            color: white;
        }
        
        .tv-btn-draw {
            background-color: var(--accent-color);
            color: white;
        }
        
        .tv-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .hidden {
            display: none;
        }
        
        .spinning {
            animation: spin 0.1s linear infinite;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .progress-info {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--warning-color);
        }
    </style>
</head>
<body>
    <div class="tv-container">
        <div class="logo">
            <h1>🎉 RAFFLE MASTERS MW</h1>
        </div>
        
        <h2 class="draw-title" id="tv-draw-name">{% if current_draw %}{{ current_draw.name.upper() }}{% else %}READY FOR DRAW{% endif %}</h2>
        <div class="prize-amount" id="tv-prize-amount">{% if current_draw %}{{ "MWK {:,.0f}".format(current_draw.prize_amount) }}{% else %}MWK 0{% endif %}</div>
        <div class="participant-count" id="tv-participant-count">0 Participants</div>
        
        <div class="progress-info" id="progress-info"></div>
        
        <div class="draw-container">
            <div class="number-display" id="number-display">READY</div>
            <div class="winner-display hidden" id="winner-display"></div>
            <div class="winners-list hidden" id="winners-list"></div>
        </div>
        
        <div class="draw-controls">
            <button class="tv-btn tv-btn-start" id="tv-start-draw">START DRAW</button>
            <button class="tv-btn tv-btn-stop hidden" id="tv-stop-draw">STOP DRAW</button>
            <button class="tv-btn tv-btn-draw hidden" id="tv-draw-winner">DRAW WINNER</button>
        </div>
    </div>

    <script>
        class RaffleDrawTV {
            constructor() {
                this.isDrawing = false;
                this.animationInterval = null;
                this.currentWinners = [];
                this.totalWinners = 0;
                this.winnersDrawn = 0;
                
                this.initializeEventListeners();
                this.updateDrawStatus();
            }
            
            initializeEventListeners() {
                document.getElementById('tv-start-draw').addEventListener('click', () => this.startDraw());
                document.getElementById('tv-stop-draw').addEventListener('click', () => this.stopDraw());
                document.getElementById('tv-draw-winner').addEventListener('click', () => this.drawWinner());
                
                // Double click to exit TV mode (for admin)
                document.addEventListener('dblclick', () => {
                    window.location.href = '/';
                });
            }
            
            async startDraw() {
                try {
                    const response = await fetch('/api/draws/start', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.isDrawing = true;
                        this.updateUIForDrawing();
                        this.updateDrawStatus();
                    } else {
                        alert('Error: ' + data.message);
                    }
                } catch (error) {
                    console.error('Error starting draw:', error);
                    alert('Error starting draw');
                }
            }
            
            async stopDraw() {
                try {
                    const response = await fetch('/api/draws/stop', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success) {
                        this.isDrawing = false;
                        this.stopAnimation();
                        this.updateUIForStopped();
                    }
                } catch (error) {
                    console.error('Error stopping draw:', error);
                }
            }
            
            async drawWinner() {
                if (!this.isDrawing) return;
                
                // Start animation before drawing winner
                await this.startAnimation();
                
                try {
                    const response = await fetch('/api/draws/draw-winner', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        }
                    });
                    
                    const data = await response.json();
                    
                    if (data.success && data.winner) {
                        this.displayWinner(data.winner);
                        this.currentWinners.push(data.winner);
                        this.winnersDrawn = data.winner.position;
                        this.totalWinners = data.winner.total_winners;
                        
                        this.updateProgressInfo();
                        this.updateWinnersList();
                        
                        // If draw is complete, stop the draw
                        if (data.winner.draw_complete) {
                            setTimeout(() => {
                                this.stopDraw();
                                this.showFinalWinners();
                            }, 5000);
                        } else {
                            // Continue to next winner after delay
                            setTimeout(() => {
                                this.resetForNextWinner();
                            }, 3000);
                        }
                    } else {
                        alert('Error drawing winner: ' + data.message);
                    }
                } catch (error) {
                    console.error('Error drawing winner:', error);
                }
            }
            
            async startAnimation() {
                const numberDisplay = document.getElementById('number-display');
                numberDisplay.classList.add('spinning');
                numberDisplay.textContent = 'DRAWING...';
                
                // Get animation sequence from server
                try {
                    const response = await fetch('/api/draws/animation');
                    const data = await response.json();
                    
                    if (data.success && data.sequence.length > 0) {
                        let index = 0;
                        this.animationInterval = setInterval(() => {
                            if (index < data.sequence.length) {
                                numberDisplay.textContent = data.sequence[index].phone_number;
                                index++;
                            } else {
                                this.stopAnimation();
                            }
                        }, 100);
                    }
                } catch (error) {
                    console.error('Error getting animation:', error);
                }
            }
            
            stopAnimation() {
                if (this.animationInterval) {
                    clearInterval(this.animationInterval);
                    this.animationInterval = null;
                }
                
                const numberDisplay = document.getElementById('number-display');
                numberDisplay.classList.remove('spinning');
            }
            
            displayWinner(winner) {
                this.stopAnimation();
                
                const numberDisplay = document.getElementById('number-display');
                const winnerDisplay = document.getElementById('winner-display');
                
                numberDisplay.classList.add('hidden');
                winnerDisplay.classList.remove('hidden');
                winnerDisplay.textContent = winner.phone_number;
                winnerDisplay.classList.add('pulse');
                
                // Create confetti effect
                this.createConfetti();
            }
            
            resetForNextWinner() {
                const numberDisplay = document.getElementById('number-display');
                const winnerDisplay = document.getElementById('winner-display');
                
                winnerDisplay.classList.remove('pulse');
                winnerDisplay.classList.add('hidden');
                numberDisplay.classList.remove('hidden');
                numberDisplay.textContent = 'READY FOR NEXT WINNER';
            }
            
            showFinalWinners() {
                const numberDisplay = document.getElementById('number-display');
                const winnerDisplay = document.getElementById('winner-display');
                const winnersList = document.getElementById('winners-list');
                
                numberDisplay.classList.add('hidden');
                winnerDisplay.classList.add('hidden');
                winnersList.classList.remove('hidden');
            }
            
            updateWinnersList() {
                const winnersList = document.getElementById('winners-list');
                winnersList.innerHTML = '';
                
                this.currentWinners.forEach(winner => {
                    const winnerItem = document.createElement('div');
                    winnerItem.className = 'winner-item';
                    winnerItem.innerHTML = `
                        <span>${winner.phone_number}</span>
                        <span class="winner-position">${winner.position}${this.getOrdinalSuffix(winner.position)}</span>
                    `;
                    winnersList.appendChild(winnerItem);
                });
            }
            
            updateProgressInfo() {
                const progressInfo = document.getElementById('progress-info');
                if (this.totalWinners > 1) {
                    progressInfo.textContent = `Winner ${this.winnersDrawn} of ${this.totalWinners}`;
                    progressInfo.classList.remove('hidden');
                } else {
                    progressInfo.classList.add('hidden');
                }
            }
            
            getOrdinalSuffix(number) {
                if (number % 100 >= 11 && number % 100 <= 13) return 'th';
                switch (number % 10) {
                    case 1: return 'st';
                    case 2: return 'nd';
                    case 3: return 'rd';
                    default: return 'th';
                }
            }
            
            updateUIForDrawing() {
                document.getElementById('tv-start-draw').classList.add('hidden');
                document.getElementById('tv-stop-draw').classList.remove('hidden');
                document.getElementById('tv-draw-winner').classList.remove('hidden');
            }
            
            updateUIForStopped() {
                document.getElementById('tv-start-draw').classList.remove('hidden');
                document.getElementById('tv-stop-draw').classList.add('hidden');
                document.getElementById('tv-draw-winner').classList.add('hidden');
            }
            
            async updateDrawStatus() {
                try {
                    const response = await fetch('/api/draws/status');
                    const data = await response.json();
                    
                    if (data.is_running) {
                        this.isDrawing = true;
                        this.totalWinners = data.total_winners;
                        this.winnersDrawn = data.winners_drawn;
                        this.updateUIForDrawing();
                        this.updateProgressInfo();
                    }
                } catch (error) {
                    console.error('Error updating draw status:', error);
                }
            }
            
            createConfetti() {
                // Simple confetti effect implementation
                const colors = ['#e74c3c', '#3498db', '#2ecc71', '#f1c40f', '#9b59b6'];
                const container = document.body;
                
                for (let i = 0; i < 50; i++) {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = '50%';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-10px';
                    confetti.style.zIndex = '9999';
                    
                    container.appendChild(confetti);
                    
                    const animation = confetti.animate([
                        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                        { transform: `translateY(100vh) rotate(${Math.random() * 360}deg)`, opacity: 0 }
                    ], {
                        duration: Math.random() * 3000 + 2000,
                        easing: 'cubic-bezier(0.1, 0.8, 0.2, 1)'
                    });
                    
                    animation.onfinish = () => confetti.remove();
                }
            }
        }
        
        // Initialize the raffle draw system when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new RaffleDrawTV();
        });
    </script>
</body>
</html>
