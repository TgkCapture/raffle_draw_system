<!-- app/templates/tv_display.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raffle Draw - TV Display</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tv_display.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tv-container">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/mbc-white-logo.png') }}" alt="MBC Logo">
        </div>
        
        <h2 class="draw-title" id="tv-draw-name">{% if current_draw %}{{ current_draw.name.upper() }}{% else %}READY FOR DRAW{% endif %}</h2>
        <div class="prize-amount" id="tv-prize-amount">{% if current_draw %}{{ "MWK {:,.0f}".format(current_draw.prize_amount) }}{% else %}MWK 0{% endif %}</div>
        <div class="participant-count" id="tv-participant-count">0 Participants</div>
        
        <div class="progress-info hidden" id="progress-info"></div>
        
        <div class="draw-container">
            <div class="number-display" id="number-display">READY</div>
            <div class="winner-display hidden" id="winner-display"></div>
            <div class="winners-list hidden" id="winners-list"></div>
        </div>
        
        <div class="draw-controls">
            <button class="tv-btn tv-btn-start" id="tv-start-draw">START DRAW</button>
            <button class="tv-btn tv-btn-stop hidden" id="tv-stop-draw">STOP DRAW</button>
            <button class="tv-btn tv-btn-draw hidden" id="tv-draw-winner">DRAW WINNER</button>
        </div>
    </div>

    <div id="confetti-container"></div>

    <script src="{{ url_for('static', filename='js/tv_display.js') }}"></script>
</body>
</html>
